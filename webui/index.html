<!DOCTYPE html>
<html lang="en-AU" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCORE report</title>
<!--
  The review front end, ported from the Claude design prototype.

  The prototype rendered through a design-compiler runtime that pulls React,
  ReactDOM and Babel from unpkg at load. That is right for a design preview and
  wrong for a clinical tool: it needs the network to draw a screen, and it
  transpiles in the browser on every open. This is the same design as plain
  HTML, CSS and JavaScript - no framework, no build, no network.

  The layout and component language are the prototype's. The palette is not:
  it is drawn from the Compumedics applications this panel sits beside -
  ProDigi's purple header and Profusion EEG's indigo ribbon - so the report
  reads as part of the software a clinician already has open. See app.css.
-->
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <div class="shell">

    <header class="studybar" id="studybar"></header>

    <div class="body">
      <nav class="rail" id="rail" aria-label="Report sections"></nav>
      <main class="main" id="main"></main>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
